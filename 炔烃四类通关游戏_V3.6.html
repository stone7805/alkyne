    {id:'N4',stage:0,title:'第四份标签：识别支链',prompt:'别把甲基支链误算成连续主链。',molecule:'CH₃–CH(CH₃)–C≡CH',points:5,steps:[choice('chain','包含三键的最长连续主链有几个碳',[['5','5 个'],['4','4 个'],['3','3 个']],'4'),choice('direction','从哪端起编使三键位次较小',[['left','左端'],['right','右端']],'right'),choice('locant','三键起始位次',[['2','2'],['1','1']],'1'),choice('branch','甲基支链的位次',[['2','2'],['4','4'],['3','3']],'3'),nameStep(['3-甲基-1-丁炔','3-甲基丁-1-炔'])],hints:['主链是连续路径，且必须经过三键。','先让三键取得较小位次，再标甲基所在的碳。'],output:'3-甲基-1-丁炔：四碳主链含三键，甲基在 3 号碳。',practice:{prompt:'HC≡C–CH(CH₃)–CH₂–CH₃ 的正确名称是？',options:[['p1','3-甲基-1-戊炔'],['p2','3-甲基-2-戊炔'],['p3','4-甲基-1-戊炔']],'answer':'p1',explain:'五碳主链包含三键；三键在 1 位，甲基在 3 位。'}},
    {id:'S1',stage:1,title:'给乙炔搭结构',prompt:'先选结构并确认，再核分子式与碳价键。',molecule:'目标名称：乙炔',points:5,steps:[choice('structure','选出对应结构',[['a','CH₂=CH₂'],['b','HC≡CH'],['c','CH₃–CH₃']],'b',{confirm:true,cards:true}),choice('formula','计算分子式',[['c2h4','C₂H₄'],['c2h2','C₂H₂'],['c2h6','C₂H₆']],'c2h2'),choice('valence','检查一个三键端碳的四价',[['v2','三键 3 + 一个 C—H 单键 1'],['v1','三键 3 + 两个 C—H 单键 2'],['v3','只有三键 3，无需其他键']],'v2')],hints:['先让两个碳用三键相连，再检查剩余的氢。','三键占三价，端碳还可以再形成一个单键。'],output:'乙炔 HC≡CH 的分子式是 C₂H₂。',practice:{prompt:'给丙炔选结构：',options:[['p1','CH₃–CH=CH₂'],['p2','HC≡C–CH₃'],['p3','CH₃–CH₂–CH₃']],'answer':'p2',explain:'丙炔是 HC≡C–CH₃，分子式 C₃H₄。'}},
    {id:'S2',stage:1,title:'给 1-丁炔搭结构',prompt:'核对三键是否在链端。',molecule:'目标名称：1-丁炔',points:6,steps:[choice('structure','选出对应结构',[['a','CH₃–C≡C–CH₃'],['b','HC≡C–CH₂–CH₃'],['c','HC≡C–CH₃'],['d','CH₂=CH–CH₂–CH₃']],'b',{confirm:true,cards:true}),choice('formula','计算分子式',[['c4h8','C₄H₈'],['c4h6','C₄H₆'],['c3h4','C₃H₄']],'c4h6'),choice('valence','检查三键端碳',[['v1','链端碳为 HC≡，有一个氢'],['v2','链端碳为 H₂C≡，有两个氢'],['v3','两端三键碳都各有一个氢']],'v1')],hints:['名称里的 1 指三键从 1 号碳开始。','比较首端是否为 HC≡，然后再数碳和氢。'],output:'1-丁炔 HC≡C–CH₂–CH₃ 为 C₄H₆。',practice:{prompt:'给 1-戊炔选结构：',options:[['p1','CH₃–C≡C–CH₂–CH₃'],['p2','HC≡C–CH₂–CH₂–CH₃'],['p3','HC≡C–CH(CH₃)–CH₃']],'answer':'p2',explain:'1-戊炔是五碳直链，三键位于 1 位。'}},
    {id:'S3',stage:1,title:'给 2-丁炔搭结构',prompt:'分清同分子式中的三键位置。',molecule:'目标名称：2-丁炔',points:7,steps:[choice('structure','选出对应结构',[['a','HC≡C–CH₂–CH₃'],['b','CH₃–CH=CH–CH₃'],['c','CH₃–C≡C–CH₃'],['d','CH₃–CH₂–CH₂–CH₃']],'c',{confirm:true,cards:true}),choice('formula','计算分子式',[['c4h10','C₄H₁₀'],['c4h6','C₄H₆'],['c4h8','C₄H₈']],'c4h6'),choice('valence','检查三键碳的氢',[['v1','两个三键碳都不连氢'],['v2','两个三键碳各连一个氢'],['v3','左侧三键碳连两个氢']],'v1')],hints:['三键起始位次是 2，先筛掉链端三键。','中间两个三键碳还各连一个碳，四价已满。'],output:'2-丁炔 CH₃–C≡C–CH₃ 为 C₄H₆，三键碳不连氢。',practice:{prompt:'给 2-戊炔选结构：',options:[['p1','HC≡C–CH₂–CH₂–CH₃'],['p2','CH₃–C≡C–CH₂–CH₃'],['p3','HC≡C–CH(CH₃)–CH₃']],'answer':'p2',explain:'2-戊炔的三键在 2、3 号碳之间，分子式 C₅H₈。'}},
    {id:'S4',stage:1,title:'搭建带支链的炔烃',prompt:'同时检查主链、支链、分子式。',molecule:'目标名称：3-甲基-1-丁炔',points:7,steps:[choice('structure','选出对应结构',[['a','HC≡C–CH₂–CH₂–CH₃'],['b','CH₃–C≡C–CH(CH₃)–CH₃'],['c','HC≡C–CH(CH₃)–CH₃'],['d','HC≡C–C(CH₃)₂–CH₃']],'c',{confirm:true,cards:true}),choice('formula','计算分子式',[['c5h10','C₅H₁₀'],['c5h8','C₅H₈'],['c4h6','C₄H₆']],'c5h8'),choice('valence','检查 3 号碳',[['v1','连三条 C—C 单键和一个 C—H 单键'],['v2','连四条 C—C 单键和一个氢'],['v3','只连两条 C—C 单键和两个氢']],'v1')],hints:['找一条含三键的最长连续四碳路径。','3 号碳连着两个主链邻碳和一个甲基，还能连一个氢。'],output:'3-甲基-1-丁炔 HC≡C–CH(CH₃)–CH₃ 为 C₅H₈。',practice:{prompt:'给 3-甲基-1-戊炔选结构：',options:[['p1','HC≡C–CH₂–CH(CH₃)–CH₃'],['p2','HC≡C–CH(CH₃)–CH₂–CH₃'],['p3','CH₃–C≡C–CH(CH₃)–CH₃']],'answer':'p2',explain:'五碳主链三键在 1 位，甲基在 3 位，分子式 C₆H₁₀。'}},
    {id:'I1',stage:2,title:'C₄H₆：先筛后去重',prompt:'只计开链、恰有一个 C≡C 且没有其他重键的炔烃；反向书写只算同一种。',molecule:'范围：C₄H₆ · 开链单炔烃',points:10,steps:[choice('select','选出全部符合范围的结构卡',[['a','HC≡C–CH₂–CH₃'],['b','CH₃–C≡C–CH₃'],['c','CH₃–CH₂–C≡CH'],['d','CH₂=CH–CH=CH₂'],['e','环丁烯（C₄H₆）']],['a','b','c'],{type:'multi',confirm:true,cards:true}),choice('duplicate','哪两张是反向写法的同一结构',[['ab','A 与 B'],['ac','A 与 C'],['bc','B 与 C']],'ac'),choice('count','去重后共有几种',[['3','3 种'],['2','2 种'],['4','4 种']],'2')],hints:['先逐张检查“开链”和“恰好一处三键”。','反向写法不会创造新的碳连接；再数不重复的结构。'],output:'C₄H₆ 范围内两种开链单炔烃：1-丁炔、2-丁炔。',practice:{prompt:'新的 C₅H₈ 卡组有 1-戊炔、2-戊炔、3-甲基-1-丁炔和反向写的 1-戊炔。限定开链单炔烃，去重后几种？',options:[['p1','2 种'],['p2','3 种'],['p3','4 种']],'answer':'p2',explain:'反向写的 1-戊炔重复，其余三种结构不同。'}},
    {id:'I2',stage:2,title:'C₅H₈：辨位置与骨架',prompt:'同样只计开链、恰有一个 C≡C 且无其他重键的炔烃。',molecule:'范围：C₅H₈ · 开链单炔烃',points:15,steps:[choice('select','选出全部符合范围的结构卡',[['a','HC≡C–CH₂–CH₂–CH₃'],['b','CH₃–C≡C–CH₂–CH₃'],['c','HC≡C–CH(CH₃)–CH₃'],['d','CH₃–CH₂–CH₂–C≡CH'],['e','CH₂=CH–CH=CH–CH₃'],['f','环戊烯（C₅H₈）']],['a','b','c','d'],{type:'multi',confirm:true,cards:true}),choice('duplicate','先找出反向重复的一组',[['ad','A 与 D'],['ab','A 与 B'],['cd','C 与 D']],'ad'),choice('count','去重后有几种',[['4','4 种'],['3','3 种'],['2','2 种']],'3'),choice('relation','比较 A/B 与 A/C 的关系',[['r1','A/B 是位置异构；A/C 是碳骨架异构'],['r2','A/B 是碳骨架异构；A/C 是位置异构'],['r3','A/B 与 A/C 都是反向重复']],'r1')],hints:['分子式相同不等于都属于限定的结构类别。','直链三键位次不同是位置异构；直链与带支链对比是骨架异构。'],output:'C₅H₈ 的三种开链单炔烃：1-戊炔、2-戊炔、3-甲基-1-丁炔。',practice:{prompt:'C₆H₁₀ 中，1-己炔与 2-己炔、1-己炔与 3-甲基-1-戊炔分别是什么关系？',options:[['p1','依次是位置异构、骨架异构'],['p2','依次是骨架异构、位置异构'],['p3','两组都是反向画法']], 'answer':'p1',explain:'前者直链且三键位置改变；后者碳骨架变为支链。'}},
    {id:'E1',stage:3,title:'任务1：先看懂橙色',prompt:'样品已预设。分别运行 A、B 两组，先后不限；除样品外，其余虚拟模型条件相同。',learningGoal:'比较甲烷与乙炔在同条件下的颜色变化，并把宏观现象与分子结构联系起来。',principle:'溴水的橙黄色来自溶液中的 Br₂。含不饱和碳碳键的物质可能通过加成消耗 Br₂；是否发生、哪组发生，要结合本题结构卡与两组运行记录判断。',molecule:'A 组：甲烷 CH₄ ｜ B 组：乙炔 HC≡CH',points:10,lab:true,preset:{A:'methane',B:'ethyne'},samples:[['methane','甲烷 CH₄'],['ethyne','乙炔 HC≡CH']],observations:{methane:'起始橙黄色基本保持',ethyne:'起始橙黄色逐渐变浅，最终接近无色'},conclusionLabel:'第1步｜概括两组观察',conclusions:[['c1','两组都褪色，因此观察相同'],['c2','甲烷组保持橙黄色，乙炔组逐渐褪色；两组观察不同'],['c3','甲烷组褪色，乙炔组保持橙黄色']],answerConclusion:'c2',evidenceLabel:'第2步｜解释为什么不同',evidence:[['e1','橙黄色来自溴水中的 Br₂；本模型中乙炔的 C≡C 可发生加成并消耗 Br₂，而甲烷组不消耗 Br₂'],['e2','乙炔本身无色，所以把橙黄色遮住了'],['e3','A、B 字母不同，所以颜色一定不同']],answerEvidence:'e1',hints:['先比较两份可见记录：哪一组保持，哪一组逐渐变浅？','褪色表示有色的 Br₂ 被消耗；再看哪一个样品含 C≡C。'],output:'橙黄色来自 Br₂；本模型中乙炔通过加成消耗 Br₂，甲烷组不消耗。这个现象仍不是纯度证明。',practice:{prompt:'同条件虚拟观察：乙烷组橙黄色保持，丙炔组逐渐褪色。哪项解释最完整？',options:[['p1','丙炔本身无色，把橙黄色遮住了'],['p2','名称不同，所以颜色变化没有化学意义'],['p3','Br₂ 使溶液显色；丙炔的不饱和键可消耗 Br₂，而乙烷组不消耗']],answer:'p3',explain:'先说明颜色来自 Br₂，再用是否消耗 Br₂ 解释保持或褪色。'}},
    {id:'E2',stage:3,title:'任务2：比较两种不饱和物的记录',prompt:'样品已预设。分别运行 A、B 两组，比较两种已知物在相同虚拟模型条件下的观察。',learningGoal:'判断“溴水褪色”能否作为区分烯烃与炔烃的专一证据。',principle:'鉴别要求现象具有专一性：如果两种已知物在同一试剂下出现相同现象，这项现象就不能单独区分它们。两组现象是否相同，必须由本题运行记录判断。',molecule:'A 组：1-丁烯 CH₂=CHCH₂CH₃ ｜ B 组：1-丁炔 HC≡CCH₂CH₃',points:10,lab:true,preset:{A:'alkene',B:'alkyne'},samples:[['alkene','1-丁烯 CH₂=CHCH₂CH₃'],['alkyne','1-丁炔 HC≡CCH₂CH₃']],observations:{alkene:'起始橙黄色逐渐变浅，最终接近无色',alkyne:'起始橙黄色逐渐变浅，最终接近无色'},conclusionLabel:'第1步｜判断能否区分',conclusions:[['c1','能，褪色只属于炔烃'],['c2','观察相同，说明两者结构一定相同'],['c3','不能只凭这一次褪色区分 1-丁烯和 1-丁炔']],answerConclusion:'c3',evidenceLabel:'第2步｜选择直接证据',evidence:[['e1','只运行一组就可以推断另一组'],['e2','两个结构不同的已知样品，在相同条件下都出现褪色'],['e3','1-丁烯和 1-丁炔的分子式不同']],answerEvidence:'e2',hints:['先只写看到的共同现象：两组是不是都褪色？','如果结构不同的两种已知物都给出相同现象，这个现象就不是炔烃独有证据。'],output:'烯烃与炔烃在此模型中都可能使溴水褪色，因此单次褪色不能区分两者。',practice:{prompt:'已知丙烯和丙炔在相同条件下都使溴水褪色。对未知样品 Z 的一次褪色，哪项判断正确？',options:[['p1','不能仅凭褪色断言 Z 是丙炔'],['p2','可以排除所有烯烃'],['p3','可以证明 Z 的结构与丙炔完全相同']],answer:'p1',explain:'同类现象可由烯烃和炔烃产生，不能作为炔烃的唯一鉴别证据。'}},
    {id:'E3',stage:3,title:'任务3：未知 X 能说到哪一步',prompt:'A 组为已知参照，B 组为未知 X。分别运行两组，再根据现有证据提交结案结论。',learningGoal:'根据未知 X 与已知参照的观察，写出不超过证据强度的结论。',principle:'相同现象不等于相同身份。判断未知物时还要检查是否排除了其他可能；尚未排除时只能说“可能”，不能说“肯定”，也不能据此宣称样品纯度。',molecule:'A 组：已知 1-丁炔 ｜ B 组：未知 X',points:10,lab:true,preset:{A:'known',B:'unknown'},samples:[['known','已知 1-丁炔'],['unknown','未知 X']],observations:{known:'起始橙黄色逐渐变浅，最终接近无色',unknown:'起始橙黄色逐渐变浅，最终接近无色'},conclusionLabel:'第1步｜提交结案结论',conclusions:[['c1','X 可能含能使溴水褪色的成分；仅凭本次观察不能证明 X 是纯炔烃'],['c2','X 肯定是纯 1-丁炔'],['c3','X 肯定不是炔烃']],answerConclusion:'c1',evidenceLabel:'第2步｜说明证据边界',evidence:[['e1','A 组的已知身份可以自动复制给 B 组'],['e2','一次褪色已经查明 X 的全部成分'],['e3','X 与已知 1-丁炔表现相同，但任务2已表明其他不饱和物也可能有同类现象']],answerEvidence:'e3',hints:['先把结论限定为“可能含有”，不要把相同现象写成相同身份。','回想任务2：不同结构也可能给出相同的褪色现象。'],output:'未知 X 的褪色只支持“可能含可反应成分”；现有证据不能证明它是纯炔烃或纯 1-丁炔。',practice:{prompt:'未知 Y 在同条件下使溴水褪色。哪条报告表述符合证据边界？',options:[['p1','Y 必是纯 1-丁炔'],['p2','Y 可能含能使溴水褪色的成分，仍需其他证据判断身份与纯度'],['p3','Y 肯定不是烯烃']],answer:'p2',explain:'一次褪色是线索，不是样品身份或纯度的唯一证明。'}}
  ];

  function refreshLab(i){var t=TASKS[i],r=state.records[i];['A','B'].forEach(function(k){var group=$('content').querySelector('[data-lab="'+k+'"]'),run=r.runs[k],v=r.draft['sample'+k];group.querySelectorAll('[data-sample]').forEach(function(b){b.setAttribute('aria-pressed',String(v===b.dataset.sample))});group.querySelector('[data-run]').disabled=!v;var out=group.querySelector('[data-output]');out.textContent=run&&run.sample===v?'已记录：'+run.observation:(t.preset?'尚未运行。':'尚未运行，或当前样品已改变。');out.classList.toggle('valid',!!run&&run.sample===v)});var ready=labReady(t,r.draft,r.runs);$('labConclusion').hidden=!ready;$('evidenceStep').hidden=!ready||!r.draft.conclusion;$('content').querySelectorAll('[data-lab-field]').forEach(function(b){b.setAttribute('aria-pressed',String(r.draft[b.dataset.labField]===b.dataset.value))});$('content').querySelectorAll('[data-lab-error]').forEach(function(p){p.hidden=r.lastErrors.indexOf(p.dataset.labError)<0});$('stepProgress').textContent=!ready?'眼前先完成两组虚拟观察：已记录 '+(['A','B'].filter(function(k){return !!r.runs[k]}).length)+'/2 组。A/B 顺序不限。':!r.draft.conclusion?'观察齐备 → 先选结论，再选依据。':!r.draft.evidence?'结论已选 → 再找对应依据；观察不会被清空。':'结论与依据已填齐 → 提交核对。';$('taskStatus').textContent=complete(t,r.draft,r.confirmed,r.runs)?'两组观察、结论与依据已齐备，可以正式提交。':!ready?'请分别运行 A、B 组；先后顺序不限。':'比较两组观察，按顺序完成结论和依据后提交。'}
  function labFieldLabel(t,key){return key==='conclusion'?(t.conclusionLabel||'结论'):(t.evidenceLabel||'依据')}
  function submitFormal(i){var n=currentStage(),t=TASKS[i],r=state.records[i];if(!state.identity||screen!=='task'||t.stage!==n||i!==firstOpen(n)||r.snapshot||!Array.from({length:n},function(_,k){return stageCleared(k)}).every(Boolean))return;var missing=!complete(t,r.draft,r.confirmed,r.runs);if(missing){var why=t.lab&&!labReady(t,r.draft,r.runs)?'两组有效观察尚未齐备或未形成单变量比较':'还有可见步骤未完成';logEvent(i,'正式','incomplete','提交被阻止',why);if(save())setFeedback(why+'；本次不计正式尝试。','bad');return}r.attempts++;var bad=grade(t,r.draft,r.confirmed,r.runs);logEvent(i,'正式','submit',bad.length?'错误':'通过',bad.join('|'));if(bad.length){r.hadWrong=true;r.lastErrors=bad;var first=bad[0],field=t.lab?labFieldLabel(t,first):t.steps.find(function(s){return s.key===first}).title;var line='与证据冲突的字段：'+bad.map(function(k){return t.lab?labFieldLabel(t,k):t.steps.find(function(s){return s.key===k}).title}).join('、')+'。\n先检查“'+field+'”。线索：'+t.hints[0];if(r.attempts>1)line+='\n进一步想：'+t.hints[1];if(save()){setFeedback(line,'bad');t.lab?refreshLab(i):refreshSteps(i)}return}r.lastErrors=[];r.snapshot={answer:copy(r.draft),confirmed:copy(r.confirmed),runs:copy(r.runs),at:Date.now()};finalize();if(save()){justPassed=i;screen='success';render();reward(i,t.points)}}
  function renderSuccess(){var i=justPassed,t=TASKS[i],n=currentStage(),qfStage=stageCleared(t.stage)?t.stage:-1;startClock(-1);var nextLabel=reportReady()?'查看一页成绩单':n>t.stage?'进入下一关':formalDone(t.stage)?pending(t.stage).length?'进入本关错题变式':'继续':'继续下一题';$('content').innerHTML='<div class="eyebrow">任务通过 · 首次得分</div><h1>'+esc(t.title)+'完成</h1><div class="stage-done"><strong>+'+t.points+' 分 · 当前总分 '+score()+' / 100</strong><p>'+esc(t.output)+'</p></div><p class="lead">'+(formalDone(t.stage)&&pending(t.stage).length?'本关正式题已做完，先清空关尾必修变式，再继续。':qfStage>=0?'本关已完整通过。可先提交阶段记录，也可直接继续，之后再补交。':'仔细说清依据，再进入下一步。')+'</p>'+quickFormBoxHtml(qfStage)+'<div class="actions"><button id="successNext" class="primary">'+nextLabel+'</button><button id="successReview">只读回看本关</button></div>'+footer();bindQuickForm(qfStage);$('successNext').onclick=function(){justPassed=-1;screen='task';render()};$('successReview').onclick=function(){reviewStage=t.stage;screen='review';render()}}

  function renderHub(n){startClock(-1);var q=pending(n),clear=q.length===0,done=stageTasks(n);$('content').innerHTML='<div class="eyebrow">第 '+(n+1)+' 关 · 关尾整理</div><h1>'+esc(STAGES[n].name)+'完成正式任务</h1><p class="lead">本关正式分 '+done.reduce(function(s,x){return s+x.task.points},0)+' 分；答错从不扣正式分，错题需用新题独立巩固。</p><div class="stage-done"><strong>'+(clear?'本关错题已清空':'还有 '+q.length+' 道必修变式')+'</strong><p>'+(clear?'可以继续下一关。':'这些题只练同一概念，不重复原题；练对才解锁下一关，重练不改正式分与尝试。')+'</p></div>'+(q.length?'<ul class="queue">'+q.map(function(x){return '<li>'+esc(x.task.title)+' · 待练</li>'}).join('')+'</ul>':'')+'<div class="actions"><button id="hubAction" class="primary">'+(q.length?'开始本关错题变式':n<3?'进入下一关':'查看通关成绩单')+'</button><button id="reviewHere">回看本关已通过任务</button></div>'+footer();$('hubAction').onclick=function(){if(currentStage()!==n||!formalDone(n))return;var now=pending(n);if(now.length){screen='practice';render();return}if(!stageCleared(n))return;screen=n===3?'report':'task';render()};$('reviewHere').onclick=function(){reviewStage=n;screen='review';render()}}

+' 请修改当前新题的答案。';$('practiceFeedback').className='feedback bad'}return}r.practiceMastered=true;r.practiceProof={choice:r.practiceChoice,at:Date.now()};r.practiceChoice=null;r.practiceError=false;finalize();if(save()){justMastered=i;screen='practice-success';render()}};$('practiceBack').onclick=function(){screen='hub';render()}}
  function renderPracticeSuccess(){var i=justMastered,t=TASKS[i],qfStage=stageCleared(t.stage)?t.stage:-1;startClock(-1);$('content').innerHTML='<div class="eyebrow">变式掌握 · 不改正式分</div><h1>'+esc(t.title)+' 已巩固</h1><div class="stage-done"><strong>新题解析</strong><p>'+esc(t.practice.explain)+'</p></div><p>正式成绩仍为 '+score()+' / 100。'+(reportReady()?'四关与错题均已完成。':'本关错题已清空，可以进入下一关。')+'</p>'+quickFormBoxHtml(qfStage)+'<div class="actions"><button id="practiceSuccessNext" class="primary">'+(reportReady()?'查看一页成绩单':'继续学习')+'</button></div>'+footer();bindQuickForm(qfStage);$('practiceSuccessNext').onclick=function(){justMastered=-1;screen='task';render()}}

  function renderReport(){if(!reportReady()){screen='task';return render()}startClock(-1);var rows=summaryRows();$('content').innerHTML='<div class="eyebrow">通关 · 课堂学习成绩</div><div class="layout-head"><div><h1>四关都已完成</h1><p class="lead">为一份可靠结论点赞，也为每次认真修正点赞。</p></div><div class="score-big">'+score()+'<small style="font-size:18px"> / 100</small></div></div><div class="report-grid"><div>班级与姓名<br><strong id="reportPerson"></strong></div><div>学号<br><strong id="reportNumber"></strong></div><div>开始 / 结束<br><strong>'+dateTime(state.started)+'<br>'+dateTime(state.ended)+'</strong></div><div>页面可见活动时间<br><strong>'+activity()+' 秒</strong></div></div><p class="tip">训练编号：'+esc(state.sessionId)+' · <strong style="color:var(--red)">错题变式已全部完成</strong>。活动时间只累计本页面可见且尚未结案的时段；若浏览器异常退出，最近一次检查点后的少量时间可能丢失。</p><div class="table-wrap"><table><thead><tr><th>关卡</th><th>正式分</th><th>正式尝试</th><th>已巩固错题</th></tr></thead><tbody>'+rows.map(function(x){return '<tr><td>'+esc(x.name)+'</td><td>'+x.score+'</td><td>'+x.attempts+'</td><td>'+x.practice+'</td></tr>'}).join('')+'</tbody></table></div><label style="display:block;margin:16px 0">自评最难部分（可选） <select id="selfAssess"><option value="">暂不填写</option>'+STAGES.map(function(x){return '<option value="'+esc(x.name)+'">'+esc(x.name)+'</option>'}).join('')+'</select></label>'+quickFormBoxHtml(3)+shareBoxHtml()+'<div class="actions"><button class="primary" id="printBtn">打印一页成绩单</button><button id="reviewReport">只读复盘</button></div><p class="report-note">QuickForm 最终记录包含身份、四关成绩与详细轨迹；短码和 CSV 仅作离线备份。配套教师解析页按提交键与训练编号合并重复记录。校验只能发现普通复制损坏，不能证明记录未被故意修改。</p><textarea id="copyFallback" class="hidden-fallback" hidden aria-label="复制回退文本"></textarea>'+footer();$('reportPerson').textContent=state.identity.className+' · '+state.identity.name;$('reportNumber').textContent=state.identity.number;$('selfAssess').value=state.selfAssess;$('selfAssess').onchange=function(){state.selfAssess=this.value;save();renderPrint()};bindQuickForm(3);bindShare();$('printBtn').onclick=function(   function renderPrint(){var card=$('printCard');if(!reportReady()){card.innerHTML='';return}var rows=summaryRows();card.innerHTML='<h1>炔烃四类通关 · 课堂成绩单</h1><p>V3.6 · 四关证据学习 · 一页记录</p><div class="print-grid"><p>班级：<strong>'+esc(state.identity.className)+'</strong></p><p>姓名：<strong>'+esc(state.identity.name)+'</strong></p><p>学号：<strong>'+esc(state.identity.number)+'</strong></p><p>训练编号：<strong>'+esc(state.sessionId)+'</strong></p><p>开始：'+esc(dateTime(state.started))+'</p><p>结束：'+esc(dateTime(state.ended))+'</p><p>活动用时：'+activity()+' 秒</p><p>自评最难：'+esc(state.selfAssess||'未填写')+'</p></div><div class="print-box"><div class="print-score">'+score()+' <span style="font-size:12pt;color:#183239">/ 100 分</span></div><p class="print-red">错题变式已全部完成</p></div><h2>四关成绩</h2><table><thead><tr><th>关卡</th><th>分项得分</th><th>正式尝试</th><th>必修变式掌握</th></tr></thead><tbody>'+rows.map(function(x){return '<tr><td>'+esc(x.name)+'</td><td>'+x.score+' / '+STAGES[STAGES.findIndex(function(s){return s.name===x.name})].points+'</td><td>'+x.attempts+' 次</td><td>'+x.practice+' 题</td></tr>'}).join('')+'</tbody></table><div class="print-box"><h2>本次学习得到的结论</h2><p>① 主链须包含 C≡C，编号先照顾三键位次；结构简式还要核对碳四价与分子式。</p><p>② C₅H₈ 的限定开链单炔烃可按结构去重，不能只凭分子式认定类别。</p><p>③ 溴水的起始橙黄色来自 Br₂；烯烃与炔烃都可能使溴水褪色，因此一次褪色不能证明未知样品是纯炔烃。</p></div><footer>课堂形成性反馈｜本机生成，非服务端认证。活动时间仅累计页面可见且训练进行中的时段。请勿将含身份的成绩单公开发布。</footer>'}
